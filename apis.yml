aid: schema-stitching
name: Schema Stitching
kind: topic
description: >-
  Schema Stitching is a GraphQL technique for combining multiple GraphQL
  schemas into a single unified API gateway. It enables developers to compose
  distributed GraphQL services, integrate third-party APIs, and build federated
  data layers by merging types, queries, and mutations from multiple subgraphs
  into one executable schema. The primary implementation is provided by The
  Guild's graphql-tools library, with support for type merging, stitching
  directives, schema delegation, and automated query planning.
